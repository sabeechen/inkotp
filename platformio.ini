; InkOTP - offline TOTP token firmware for the M5Stack Core Ink.

[platformio]
default_envs = coreink

[env:coreink]
platform = espressif32@8.0.0
board = m5stack-coreink
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@0.3.0
; One app slot and no over-the-air slot: firmware is only ever updated by USB.
board_build.partitions = no_ota.csv
; The web UI and its QR decoder are linked into the firmware image.
board_build.embed_txtfiles =
    web/index.html
    web/vendor/jsqr.min.js
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall
; Also write one file holding the bootloader, partition table and firmware.
extra_scripts = post:tools/merge_image.py
; Hardware-independent logic is tested on the host instead (env:native).
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall
